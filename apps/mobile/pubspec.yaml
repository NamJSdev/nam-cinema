name: nam_cinema
description: Nam Cinema — Production-Ready Cross-Platform Movie Streaming Application (Your Cinema. Anywhere.)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0

  # Networking & Serialization
  dio: ^5.7.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Local Persistence & Secure Storage
  drift: ^2.22.1
  drift_flutter: ^0.2.1
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Media Playback, Caching & Platform Integration
  video_player: ^2.9.2
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  wakelock_plus: ^1.2.8
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  drift_dev: ^2.22.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
